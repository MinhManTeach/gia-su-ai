# =====================================================================
# T-05 · CẤU HÌNH CÔNG CỤ ƯỚC TÍNH CHI PHÍ VÀ ĐỘ TRỄ MỘT BUỔI HỌC
#
# MỌI con số giá đều lấy từ docs/nghien-cuu/giong-noi.md
# (thẻ T-01, kiểm tra ngày 16/10/2026). Không sửa giá trong code —
# muốn đổi giá chỉ sửa file này.
#
# Chỗ ghi "GIẢ ĐỊNH TẠM" là số chưa có nguồn chính thức, chờ đo hoặc
# chờ chọn dịch vụ ở T-06. Đừng coi đó là số đã biết.
# =====================================================================

[tham_so]
# Tỷ giá quy đổi USD -> VND. T-01 ghi "cần cập nhật" nên để ở đây cho dễ sửa.
ty_gia_usd_vnd = 26000
# Số buổi học mỗi tuần. T-01 dùng 3 buổi/tuần ~= 13 buổi/tháng (3 x 52 / 12).
buoi_moi_tuan = 3
# Thời lượng buổi học cần ước tính (phút). Đặc tả: mỗi buổi dưới 30 phút.
thoi_luong_phut = [15, 25, 30]

# ---------------------------------------------------------------------
# GIÁ DỊCH VỤ — nguồn: docs/nghien-cuu/giong-noi.md
# ---------------------------------------------------------------------

[gia.stt.google_v2]
mo_ta = "Google Cloud Speech-to-Text V2 (gồm Chirp). Làm tròn theo giây."
tien_te = "USD"
gia_moi_phut = 0.016

[gia.stt.fpt]
mo_ta = "FPT.AI Speech to Text. T-01: gói 2.000 phút 1,4 triệu VND (~700 VND/phút); gói 10.000 phút 5,4 triệu VND (~540 VND/phút). Bảng ước tính mục 3 của T-01 dùng 620 VND/phút nên giữ đúng số đó để đối chiếu."
tien_te = "VND"
gia_moi_phut = 620
# Azure AI Speech: T-01 ghi "cần kiểm tra trên trang giá/calculator" -> chưa đưa vào.

[gia.tts.fpt]
mo_ta = "FPT.AI Text to Speech. T-01: gói 1 triệu VND = 4 triệu ký tự (~0,25 VND/ký tự)."
tien_te = "VND"
gia_moi_ky_tu = 0.25
# Azure TTS: giá cần kiểm tra -> chưa đưa vào.

[gia.llm]
mo_ta = "Mô hình ngôn ngữ trả lời (kiểu A: STT -> mô hình -> TTS). CHƯA CHỌN mô hình ở T-01 nên để 0; điền giá khi chọn."
tien_te = "USD"
gia_1m_token_vao = 0.0
gia_1m_token_ra = 0.0

[gia.khac]
# Chi phí hạ tầng mỗi buổi (VND): máy chủ, băng thông, lưu trữ...
# Chưa có kiến trúc hạ tầng nên để 0; điền sau.
ha_tang_vnd_moi_buoi = 0

# ---------------------------------------------------------------------
# ĐỘ TRỄ MỖI LƯỢT — GIẢ ĐỊNH TẠM, chờ số đo thật ở T-06.
# T-01 không có số liệu độ trễ nên các số dưới đây chỉ để công cụ
# chạy được và cho ra khung ước tính; đừng coi là đã đo.
# Đơn vị: giây cho MỖI LƯỢT hội thoại.
# ---------------------------------------------------------------------
[do_tre]
stt_giay = 2.0   # nhận giọng: trẻ nói xong -> có văn bản
llm_giay = 2.0   # mô hình: có văn bản -> sinh xong câu trả lời
tts_giay = 2.0   # đọc: có câu trả lời -> phát ra âm thanh đầu tiên

# ---------------------------------------------------------------------
# KỊCH BẢN BUỔI HỌC — số liệu cho buổi CHUẨN 25 phút.
# Buổi 15/30 phút được CO GIÃN TUYẾN TÍNH theo tỉ lệ (15/25, 30/25).
# Xem README.md để biết vì sao chọn cách này.
#
# Giả định gốc từ T-01 mục 3: mic chỉ gửi khi trẻ nói nhờ phát hiện
# giọng (VAD) ~10 phút âm thanh gửi đi; AI nói ~8 phút ~= 6.000 ký tự
# tiếng Việt cho buổi 25 phút ở kịch bản "trung bình".
#
# Token vào mô hình: mỗi lượt gửi lại cả lịch sử hội thoại, nên lượt thứ k
# (tính từ 0) gửi token_vao_moi_luot + k x token_lich_su_moi_luot.
# Tổng cả buổi = n x token_vao_moi_luot + token_lich_su_moi_luot x n(n-1)/2.
# ---------------------------------------------------------------------

[kich_ban.it]
ten_hien_thi = "Trẻ nói ít"
phut_tre_noi = 5       # phút âm thanh gửi đi (đã qua VAD)
ky_tu_ai_noi = 3000    # ký tự AI đọc trong buổi
luot_hoi_thoai = 8     # số lượt hội thoại trong buổi
token_vao_moi_luot = 400  # GIẢ ĐỊNH TẠM — chờ đo ở T-06
token_ra_moi_luot = 150   # GIẢ ĐỊNH TẠM — chờ đo ở T-06
token_lich_su_moi_luot = 200  # GIẢ ĐỊNH TẠM: lịch sử tăng thêm mỗi lượt (lời trẻ + lời AI) — chờ đo ở T-06

[kich_ban.trung_binh]
ten_hien_thi = "Trẻ nói trung bình"
phut_tre_noi = 10
ky_tu_ai_noi = 6000
luot_hoi_thoai = 16
token_vao_moi_luot = 400  # GIẢ ĐỊNH TẠM — chờ đo ở T-06
token_ra_moi_luot = 150   # GIẢ ĐỊNH TẠM — chờ đo ở T-06
token_lich_su_moi_luot = 200  # GIẢ ĐỊNH TẠM: lịch sử tăng thêm mỗi lượt (lời trẻ + lời AI) — chờ đo ở T-06

[kich_ban.nhieu]
ten_hien_thi = "Trẻ nói nhiều"
phut_tre_noi = 15
ky_tu_ai_noi = 9000
luot_hoi_thoai = 24
token_vao_moi_luot = 400  # GIẢ ĐỊNH TẠM — chờ đo ở T-06
token_ra_moi_luot = 150   # GIẢ ĐỊNH TẠM — chờ đo ở T-06
token_lich_su_moi_luot = 200  # GIẢ ĐỊNH TẠM: lịch sử tăng thêm mỗi lượt (lời trẻ + lời AI) — chờ đo ở T-06

# ---------------------------------------------------------------------
# PHƯƠNG ÁN GIÁ: mỗi phương án ghép 1 dịch vụ STT + 1 dịch vụ TTS.
# Muốn thêm phương án mới (ví dụ Azure khi có giá): thêm một khối
# [[phuong_an]] trỏ tới khóa đã khai báo trong [gia.stt] / [gia.tts].
# ---------------------------------------------------------------------

[[phuong_an]]
ten = "Google STT + FPT TTS"
stt = "google_v2"
tts = "fpt"

[[phuong_an]]
ten = "FPT STT + FPT TTS"
stt = "fpt"
tts = "fpt"
